<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="128" fill="#040406"/>
  <!-- Ambient glow background -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="90" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="3"/>
  
  <!-- SA Soundwave Atlas Monogram -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Sound Rings / Orbit lines -->
    <path d="M 170,256 C 170,200 342,200 342,256 C 342,312 170,312 170,256 Z" stroke-width="6" opacity="0.4" />
    <path d="M 256,170 C 312,170 312,342 256,342 C 200,342 200,170 256,170 Z" stroke-width="6" opacity="0.4" />
    
    <!-- Central Sound Atlas Note / Star Node -->
    <circle cx="256" cy="256" r="28" fill="#FFFFFF" />
    <circle cx="256" cy="256" r="48" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.8" />
  </g>
  
  <!-- Elegant SA Lettermark -->
  <text x="256" y="440" font-family="'Work Sans', system-ui, sans-serif" font-size="72" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="12">SA</text>
</svg>
